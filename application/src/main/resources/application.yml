spring:
  config:
    import: "vault://"
  cloud:
    vault:
      uri: http://localhost:8200
      # TODO: dev-only token auth with a hardcoded fallback default. Before any non-local
      #       deployment, switch to AppRole/Kubernetes auth and remove the ":myroot" default -
      #       do not commit real tokens here, rely on the VAULT_TOKEN env var only.
      token: ${VAULT_TOKEN:myroot}
      kv:
        enabled: true
        backend: secret
        default-context: auracart-application
        application-name: auracart-application
  datasource:
    master:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://localhost:5432/postgres
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
logging:
  level:
    org.springframework.web: TRACE

app:
  tenants:
    datasources:
      auracommerce1:
        url: jdbc:postgresql://localhost:5432/auracommerce1
      auracommerce2:
        url: jdbc:postgresql://localhost:5432/auracommerce2

